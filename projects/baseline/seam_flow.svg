<svg viewBox="0 0 1100 620" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="SEAM vet flow: three sources vote on each column's detector region; agreement locks it, disagreement goes to hand review" class="sf">
  <defs>
    <marker id="sf-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a93a3"/></marker>
    <marker id="sf-arA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ffc83a"/></marker>
  </defs>
  <style>
    .sf { font-family: "Share Tech Mono", ui-monospace, monospace; font-size: 13px; }
    .sf .bx { fill: #0b0f14; stroke: #2a3240; stroke-width: 1.2; }
    .sf .hd { fill: #e6e9ee; font-size: 14px; font-family: Orbitron, "Segoe UI", sans-serif; font-weight: 700; letter-spacing: 1px; }
    .sf .tx { fill: #8a93a3; font-size: 12px; }
    .sf .ln { stroke: #8a93a3; stroke-width: 1.3; fill: none; }
  </style>
  <rect class="bx" x="400" y="14" width="300" height="56" rx="3" style="stroke:#18d6f0"/>
  <text class="hd" x="550" y="38" text-anchor="middle">COLUMNS</text>
  <text class="tx" x="550" y="57" text-anchor="middle">every input column in the files</text>
  <path class="ln" d="M550 70 V92 H175 V112" marker-end="url(#sf-ar)"/>
  <path class="ln" d="M550 70 V112" marker-end="url(#sf-ar)"/>
  <path class="ln" d="M550 92 H925 V112" marker-end="url(#sf-ar)"/>
  <rect class="bx" x="40" y="114" width="270" height="118" rx="3"/>
  <text class="hd" x="56" y="138">A · NAMING RULE</text>
  <text class="tx" x="56" y="160">station codes {B,E}{I,M,O,E}{L,S}</text>
  <text class="tx" x="56" y="178">BOL → barrel · EOL → endcap</text>
  <text class="tx" x="56" y="196">RPC → barrel · TGC, CSC, NSW → endcap</text>
  <text class="tx" x="56" y="214">MDT and the rest → shared</text>
  <rect class="bx" x="415" y="114" width="270" height="118" rx="3"/>
  <text class="hd" x="431" y="138">B · REFERENCE LISTS</text>
  <text class="tx" x="431" y="160">network input lists per region</text>
  <text class="tx" x="431" y="178">selection: per-region segment minima</text>
  <text class="tx" x="431" y="196">earlier-run lists (drop-in)</text>
  <text class="tx" x="431" y="214">hand resolutions, each with a source</text>
  <rect class="bx" x="790" y="114" width="270" height="118" rx="3" stroke-dasharray="5 4"/>
  <text class="hd" x="806" y="138">C · EMPIRICAL</text>
  <text class="tx" x="806" y="160">activity, |mean|: barrel vs endcap</text>
  <text class="tx" x="806" y="178">bkg and sig, separately</text>
  <text class="tx" x="806" y="196">votes if both agree, ratio ≥ 2</text>
  <text class="tx" x="806" y="214">never resolves a conflict</text>
  <path class="ln" d="M175 232 V262 H550"/>
  <path class="ln" d="M550 232 V286" marker-end="url(#sf-ar)"/>
  <path class="ln" d="M925 232 V262 H550"/>
  <rect class="bx" x="430" y="288" width="240" height="44" rx="3"/>
  <text class="hd" x="550" y="315" text-anchor="middle">ADMIN / LEAK?</text>
  <path class="ln" d="M670 310 H880" marker-end="url(#sf-ar)"/>
  <text class="tx" x="690" y="302">yes</text>
  <rect class="bx" x="882" y="290" width="178" height="40" rx="3" style="stroke:#5b6370"/>
  <text class="tx" x="971" y="315" text-anchor="middle" style="fill:#c0c6d0">admin list · never input</text>
  <path class="ln" d="M550 332 V356" marker-end="url(#sf-ar)"/>
  <text class="tx" x="558" y="350">no</text>
  <polygon class="bx" points="550,358 690,402 550,446 410,402" style="stroke:#ffc83a"/>
  <text class="hd" x="550" y="398" text-anchor="middle" style="font-size:12px">REGION VOTES</text>
  <text class="tx" x="550" y="416" text-anchor="middle">compare A, B, C</text>
  <path class="ln" d="M410 402 H120 V474" marker-end="url(#sf-ar)"/>
  <path class="ln" d="M500 430 L370 474" marker-end="url(#sf-ar)"/>
  <path class="ln" d="M600 430 L730 474" marker-end="url(#sf-ar)"/>
  <path class="ln" d="M690 402 H980 V474" marker-end="url(#sf-ar)"/>
  <rect class="bx" x="30" y="476" width="190" height="62" rx="3" style="stroke:#3ddc97"/>
  <text class="hd" x="125" y="500" text-anchor="middle" style="fill:#3ddc97">LOCKED</text>
  <text class="tx" x="125" y="522" text-anchor="middle">≥ 2 agree, none against</text>
  <rect class="bx" x="275" y="476" width="190" height="62" rx="3" style="stroke:#ffc83a"/>
  <text class="hd" x="370" y="500" text-anchor="middle" style="fill:#ffc83a">PROVISIONAL</text>
  <text class="tx" x="370" y="522" text-anchor="middle">1 source, none against</text>
  <rect class="bx" x="635" y="476" width="190" height="62" rx="3" style="stroke:#9aa3b2"/>
  <text class="hd" x="730" y="500" text-anchor="middle" style="fill:#9aa3b2">SHARED</text>
  <text class="tx" x="730" y="522" text-anchor="middle">no region vote anywhere</text>
  <rect class="bx" x="880" y="476" width="190" height="62" rx="3" style="stroke:#ff4d6a"/>
  <text class="hd" x="975" y="500" text-anchor="middle" style="fill:#ff4d6a">CONFLICT · REVIEW</text>
  <text class="tx" x="975" y="522" text-anchor="middle">votes disagree</text>
  <path class="ln" d="M125 538 V566 H370 V538"/>
  <path class="ln" d="M248 566 V580" marker-end="url(#sf-ar)"/>
  <rect class="bx" x="70" y="582" width="356" height="32" rx="3" style="stroke:#18d6f0"/>
  <text x="160" y="603" text-anchor="middle" style="fill:#ff8a3d">barrel list</text>
  <text x="248" y="603" text-anchor="middle" style="fill:#4a5260">·</text>
  <text x="336" y="603" text-anchor="middle" style="fill:#3d9bff">endcap list</text>
  <path class="ln" d="M730 538 V580" marker-end="url(#sf-ar)"/>
  <rect class="bx" x="640" y="582" width="180" height="32" rx="3"/>
  <text class="tx" x="730" y="603" text-anchor="middle" style="fill:#c0c6d0">shared list</text>
  <path class="ln" d="M975 538 V580" marker-end="url(#sf-ar)"/>
  <rect class="bx" x="885" y="582" width="180" height="32" rx="3" style="stroke:#ff4d6a"/>
  <text class="tx" x="975" y="603" text-anchor="middle" style="fill:#c0c6d0">hand review</text>
  <path d="M1065 598 H1088 V172 H1062" fill="none" stroke="#ffc83a" stroke-width="1.3" stroke-dasharray="6 4" marker-end="url(#sf-arA)"/>
  <text x="1080" y="400" fill="#ffc83a" font-size="11" transform="rotate(-90 1080 400)" text-anchor="middle">resolution → reference lists (B) · logged in the genealogy</text>
</svg>
